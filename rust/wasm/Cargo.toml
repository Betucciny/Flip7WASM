[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# getrandom v0.4 (pulled in by rand) doesn't support wasm32-unknown-unknown by
# default. Enabling "wasm_js" makes it delegate to the browser's crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
